# Production stack for one VM. Nothing listens until you opt in:
#   docker compose --profile production up -d --build
# That publishes only 80 and 443, on the Caddy container.
# Local development uses docker-compose.dev.yml and does not load this file's ports.
# Do not add a docker-compose.override.yml that publishes 8000 or 5432.

services:
  db:
    image: postgres:16-alpine
    profiles: ["production"]
    environment:
      POSTGRES_USER: election
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a long password that is not a placeholder}
      POSTGRES_DB: election
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election -d election"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["production"]
    environment:
      DATABASE_URL: postgresql+psycopg://election:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/election
      CORS_ORIGINS: https://${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
      API_TOKEN: ${API_TOKEN:-}
      AUTH_MODE: ${AUTH_MODE:-accounts}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ENVIRONMENT: production
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.28.10.10/32}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')",
        ]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["production"]
    environment:
      API_INTERNAL_URL: http://api:8000
      # Server-side only. Never set NEXT_PUBLIC_API_TOKEN.
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal:
        ipv4_address: 172.28.10.10
      edge:
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    profiles: ["production"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate expiry notices}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10

networks:
  data:
  internal:
    ipam:
      config:
        - subnet: 172.28.10.0/24
  edge:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
