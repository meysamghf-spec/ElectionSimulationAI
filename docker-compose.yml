# Production stack for a VPS that already runs ONE shared Caddy reverse proxy.
#   docker network create caddy        # once per server, shared by every app (see DEPLOY.md)
#   docker compose --profile production up -d --build
# This file publishes NO host ports. The shared Caddy reaches the web container over the
# external "caddy" network as electionsim-web:3000. The API and database are reachable only
# on private Compose networks. Shared PostgreSQL instead of the bundled db:
#   docker compose -f docker-compose.yml -f docker-compose.shared-db.yml --profile production up -d --build
# Local development uses docker-compose.dev.yml. Do not add a docker-compose.override.yml that publishes ports.

name: electionsim

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["production"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: election
      # Not ":?" so the shared-db overlay can render without it. An empty or short password is still
      # refused: Postgres will not initialise without one, and the API refuses passwords under 16 chars.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: election
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election -d election"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    profiles: ["production"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://election:${POSTGRES_PASSWORD:-}@db:5432/election
      CORS_ORIGINS: https://${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname, for example election.example.ir}
      API_TOKEN: ${API_TOKEN:-}
      AUTH_MODE: ${AUTH_MODE:-accounts}
      ALLOW_REGISTRATION: "false"
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ENVIRONMENT: production
      TRUSTED_PROXY_CIDRS: 172.28.10.10/32
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')",
        ]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-fa}
    profiles: ["production"]
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      # Server-side only. Never set NEXT_PUBLIC_API_TOKEN.
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal:
        ipv4_address: 172.28.10.10
      proxy:
        aliases:
          - electionsim-web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

networks:
  # Database traffic only. No route to the internet.
  data:
    internal: true
  # web <-> api. The fixed web address lets the API trust X-Forwarded-For from web only.
  internal:
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # Created once per server and shared with the single Caddy container.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-caddy}

volumes:
  pgdata:
